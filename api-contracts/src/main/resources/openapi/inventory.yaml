openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
  description: |
    Manages products and stock for the reservation demo. Access tokens must be
    issued by the reservation realm and contain the `inventory-api` audience.
    Role requirements refer to Keycloak realm roles rather than OAuth scopes.
servers:
  - url: http://localhost:8081
    description: Local Inventory service
tags:
  - name: Products
    description: Product catalog and stock administration.
paths:
  /products:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: Requires the `INVENTORY_ADMIN` realm role.
      security:
        - oauth2: [inventory-api]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created.
          headers:
            Location:
              description: Absolute or origin-relative URI of the new product. Always present.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: Requires either the `CUSTOMER` or `INVENTORY_ADMIN` realm role.
      security:
        - oauth2: [inventory-api]
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of products per page, capped at 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A bounded page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product
      description: Requires either the `CUSTOMER` or `INVENTORY_ADMIN` realm role.
      security:
        - oauth2: [inventory-api]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product details and current available quantity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{id}/stock:
    post:
      tags: [Products]
      operationId: addStock
      summary: Add available stock
      description: |
        Requires the `INVENTORY_ADMIN` realm role. This mutation is not
        idempotent; retrying after an uncertain response can add stock twice.
      security:
        - oauth2: [inventory-api]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStockRequest'
      responses:
        '200':
          description: Product with its updated available quantity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        Keycloak Authorization Code flow. Business authorization uses realm roles
        from the access token. The `inventory-api` scope selects the corresponding
        audience mapper; the resulting access token must contain that audience.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/reservation/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/reservation/protocol/openid-connect/token
          scopes:
            inventory-api: Request an access token with the `inventory-api` audience.
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is malformed or violates validation constraints.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: A valid bearer access token is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The token lacks a required realm role or the `inventory-api` audience.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The product does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Adding the requested quantity would overflow the supported stock range.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, initialQuantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
        initialQuantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
    AddStockRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    Product:
      type: object
      additionalProperties: false
      required: [id, name, availableQuantity]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        availableQuantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
    ProductPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
