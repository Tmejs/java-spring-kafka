spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_ISSUER_URI:http://localhost:8180/realms/reservation}
          jwk-set-uri: ${SECURITY_JWK_SET_URI:http://localhost:8180/realms/reservation/protocol/openid-connect/certs}
          audiences: orders-api

server:
  port: 8080

reservation:
  outbox:
    batch-size: 100
    fixed-delay: 1s
    initial-delay: 1s
    ack-timeout: 10s
    backoff-initial: 1s
    backoff-max: 5m

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/orders.yaml
    disable-swagger-default-url: true
    oauth:
      client-id: reservation-swagger
      scopes: orders-api
      use-pkce-with-authorization-code-grant: true
